services:
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg15
    container_name: secnet_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-network_security}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - secnet_mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-network_security}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secnet_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - secnet_mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./crates/backend/Dockerfile
    container_name: secnet_backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-network_security}
      REDIS_URL: redis://redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_bytes_long_12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://localhost,http://localhost:80}
      RUST_LOG: ${RUST_LOG:-info,backend=debug}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - secnet_mesh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: ./crates/frontend/Dockerfile
    container_name: secnet_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - secnet_mesh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  nginx-proxy:
    image: nginx:alpine
    container_name: secnet_nginx_tls
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - secnet_mesh

  capture-engine:
    build:
      context: .
      dockerfile: ./crates/capture-engine/Dockerfile
    container_name: secnet_capture_engine
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-network_security}
      SIMULATION_MODE: "true"
      SIMULATION_PACKETS_PER_SEC: 500
      CAPTURE_INTERFACE: "eth0"
      RULES_STATE_FILE: "/data/secnet_rules_state.json"
      RUST_LOG: "info,capture_engine=debug"
    volumes:
      - capture_data:/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - secnet_mesh

networks:
  secnet_mesh:
    driver: bridge

volumes:
  timescale_data:
    driver: local
  capture_data:
    driver: local
